<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Axtrivex Jobs & Grants</title>
</head>
<body>

<h1>Axtrivex Jobs & Grants</h1>
<p>Exclusive opportunities for active subscribers</p>

<div id="jobs-grants"></div>

<button onclick="subscribeUser()">Subscribe Now – ₦1,000</button>

<!-- Flutterwave Inline Script -->
<script src="https://checkout.flutterwave.com/v3.js"></script>
<script>
let FLW_PUBLIC_KEY = "";

// Fetch public key from backend, fallback to hardcoded
fetch("https://fsi.onrender.com/api/axtrivex/config")
  .then(res => res.json())
  .then(data => {
    FLW_PUBLIC_KEY = data.flutterwavePublicKey || "FLWPUBK-xxxxxxxxxxxxxxxxxxxxxx-X"; // replace with your real key
  });

// 🚀 Subscribe + Pay
function subscribeUser(){
  const email = prompt("Enter your email:");
  const name = prompt("Enter your name:");
  if(!email || !name){ alert("Email and name required"); return; }

  FlutterwaveCheckout({
    public_key: FLW_PUBLIC_KEY,
    tx_ref: "AXTRIVEX-" + Date.now(),
    amount: 1000,
    currency: "NGN",
    payment_options: "card,banktransfer,ussd,account",
    customer:{ email, name },
    customizations:{
      title:"Axtrivex Technologies",
      description:"Jobs & Grants Subscription"
    },
    callback: async function(response){
      const verifyRes = await fetch("https://fsi.onrender.com/api/axtrivex/verify-payment", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ transaction_id: response.transaction_id, email })
      });
      const verifyData = await verifyRes.json();
      if(verifyData.success){
        localStorage.setItem("axtrivex_user", email);
        alert("Subscription activated! 🎉");
      } else {
        alert("Payment verification failed.");
      }
    },
    onclose:function(){ alert("Payment window closed."); }
  });
}
</script>

</body>
</html>
