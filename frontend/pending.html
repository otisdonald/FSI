<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FSI Application Pending</title>
  <script>
    async function verifyPayment() {
      const appData = JSON.parse(localStorage.getItem("fsi_application"));
      if (!appData) {
        document.getElementById("status").innerText = "No application found.";
        return;
      }

      try {
        // Get transaction_id from URL (TransactPay redirects with it)
        const urlParams = new URLSearchParams(window.location.search);
        const transaction_id = urlParams.get("transaction_id");

        if (!transaction_id) {
          document.getElementById("status").innerText = "Missing transaction ID.";
          return;
        }

        // Call backend to verify payment
        const res = await fetch("https://fsi.onrender.com/api/verify-payment", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            transaction_id,
            email: appData.email
          })
        });

        const data = await res.json();
        if (data.success) {
          document.getElementById("status").innerText =
            "🎉 Payment successful! Your application has been submitted.";
        } else {
          document.getElementById("status").innerText =
            "❌ Payment verification failed. Please try again.";
        }
      } catch (err) {
        document.getElementById("status").innerText =
          "Server error during verification.";
        console.error(err);
      }
    }

    window.onload = verifyPayment;
  </script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
  <div class="bg-white shadow-md rounded p-6 text-center">
    <h1 class="text-xl font-bold mb-4">Application Pending</h1>
    <p id="status" class="text-gray-700">Verifying your payment...</p>
  </div>
</body>
</html>
